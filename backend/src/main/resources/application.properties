spring.application.name=cacotalk

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST}

# sliding expiry
app.auth.session.ttl=7d
app.auth.session.cookie-secure=true

app.frontend-origin=${FRONTEND_ORIGIN}

app.message.encryption-key=${MESSAGE_ENCRYPTION_KEY}

# how many messages can be sent in a fixed time window
app.message.rate-limit.max=12
# how long that window is
app.message.rate-limit.window=10s

spring.profiles.active=${SPRING_PROFILES_ACTIVE}